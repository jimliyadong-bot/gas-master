<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('修改采购商')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-buyer-edit" th:object="${buyer}">
			<input id="buyerId" name="buyerId" th:field="*{buyerId}" type="hidden">
			<h4 class="form-header">基础信息</h4>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">采购商名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="buyerName" id="buyerName" th:field="*{buyerName}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">简称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="shortName" th:field="*{shortName}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">联系人：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="contactName" th:field="*{contactName}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">联系电话：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="contactPhone" th:field="*{contactPhone}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">短信通知手机号：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="notifyPhones" th:field="*{notifyPhones}" placeholder="多个手机号用英文逗号分隔">
				</div>
			</div>
			<h4 class="form-header">开票提醒（短信通知采购商）</h4>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">批次剩余提醒比例(%)：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="invoiceRemindRatio" th:field="*{invoiceRemindRatio}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">用完未开票提醒间隔(天)：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="invoiceRemindDays" th:field="*{invoiceRemindDays}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">用完未开票最多提醒(次)：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="invoiceRemindMax" th:field="*{invoiceRemindMax}" required>
				</div>
			</div>
			<h4 class="form-header">拉卡拉商户配置（收款进入该采购商商户号）</h4>
			<div class="form-group">
				<label class="col-sm-3 control-label">商户号：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="merchant.merchantNo" id="merchantNo"
						th:value="${buyer.merchant != null ? buyer.merchant.merchantNo : ''}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">接入方式：</label>
				<div class="col-sm-8">
					<select class="form-control" name="merchant.payMode" id="payMode">
						<option value="">待定（收银台/JSAPI 确认前可留空）</option>
						<option value="CASHIER" th:selected="${buyer.merchant != null && buyer.merchant.payMode == 'CASHIER'}">收银台</option>
						<option value="JSAPI" th:selected="${buyer.merchant != null && buyer.merchant.payMode == 'JSAPI'}">JSAPI</option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">终端号：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="merchant.termNo"
						th:value="${buyer.merchant != null ? buyer.merchant.termNo : ''}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">开放平台应用ID：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="merchant.appId"
						th:value="${buyer.merchant != null ? buyer.merchant.appId : ''}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">密钥引用：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="merchant.secretRef"
						th:value="${buyer.merchant != null ? buyer.merchant.secretRef : ''}" placeholder="配置项名或加密串，不存明文">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "gas/buyer";

		$("#form-buyer-edit").validate({
			onkeyup: false,
			rules: {
				buyerName: {
					remote: {
						url: prefix + "/checkBuyerNameUnique",
						type: "post",
						dataType: "json",
						data: {
							"buyerId": function() { return $("#buyerId").val(); },
							"buyerName": function() { return $.common.trim($("#buyerName").val()); }
						}
					}
				},
				merchantNo: {
					remote: {
						url: prefix + "/checkMerchantNoUnique",
						type: "post",
						dataType: "json",
						data: {
							"merchantId": function() { return "[[${buyer.merchant != null ? buyer.merchant.merchantId : 0}]]"; },
							"merchantNo": function() { return $.common.trim($("#merchantNo").val()); }
						}
					}
				},
				invoiceRemindRatio: { range: [0, 100] },
				invoiceRemindDays: { digits: true, min: 1 },
				invoiceRemindMax: { digits: true, min: 1 }
			},
			messages: {
				"buyerName": { remote: "采购商名称已经存在" },
				"merchant.merchantNo": { remote: "商户号已经存在" }
			},
			focusCleanup: true
		});

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/edit", $('#form-buyer-edit').serialize());
			}
		}
	</script>
</body>
</html>
