<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('修改业务参数')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-config-edit" th:object="${config}">
			<div class="form-group">
				<label class="col-sm-3 control-label">参数键：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" th:field="*{configKey}" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">参数值：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="configValue" id="configValue" th:field="*{configValue}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">说明：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "gas/config";

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/edit", $('#form-config-edit').serialize());
			}
		}
	</script>
</body>
</html>
