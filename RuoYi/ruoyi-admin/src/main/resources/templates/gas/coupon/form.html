<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('优惠券模板')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-coupon-edit">
    <input type="hidden" name="templateId" th:value="${template.templateId}"/>
    <div class="form-group"><label class="col-sm-3 control-label is-required">采购商：</label><div class="col-sm-8">
        <select class="form-control" name="buyerId" required><option value="">请选择</option>
            <option th:each="buyer:${buyers}" th:value="${buyer.buyerId}" th:text="${buyer.buyerName}" th:selected="${buyer.buyerId==template.buyerId}"></option>
        </select></div></div>
    <div class="form-group"><label class="col-sm-3 control-label is-required">券名称：</label><div class="col-sm-8"><input class="form-control" name="name" th:value="${template.name}" maxlength="64" required/></div></div>
    <div class="form-group"><label class="col-sm-3 control-label is-required">面额（元）：</label><div class="col-sm-8"><input class="form-control" type="number" step="0.01" min="0.01" name="faceValue" th:value="${template.faceValue}" required/></div></div>
    <div class="form-group"><label class="col-sm-3 control-label is-required">使用门槛（元）：</label><div class="col-sm-8"><input class="form-control" type="number" step="0.01" min="0" name="thresholdAmount" th:value="${template.thresholdAmount!=null?template.thresholdAmount:0}" required/></div></div>
    <div class="form-group"><label class="col-sm-3 control-label is-required">有效期类型：</label><div class="col-sm-8">
        <select class="form-control" name="validType" id="validType" onchange="toggleValidity()">
            <option value="DAYS" th:selected="${template.validType==null or template.validType=='DAYS'}">领取后N天</option>
            <option value="FIXED" th:selected="${template.validType=='FIXED'}">固定日期</option>
        </select></div></div>
    <div class="form-group" id="daysGroup"><label class="col-sm-3 control-label is-required">有效天数：</label><div class="col-sm-8"><input class="form-control" type="number" min="1" max="3650" name="validDays" th:value="${template.validDays!=null?template.validDays:30}"/></div></div>
    <div class="form-group fixedGroup"><label class="col-sm-3 control-label is-required">固定开始：</label><div class="col-sm-8"><input class="form-control" name="validFrom" th:value="${#dates.format(template.validFrom,'yyyy-MM-dd HH:mm:ss')}" placeholder="yyyy-MM-dd HH:mm:ss"/></div></div>
    <div class="form-group fixedGroup"><label class="col-sm-3 control-label is-required">固定结束：</label><div class="col-sm-8"><input class="form-control" name="validTo" th:value="${#dates.format(template.validTo,'yyyy-MM-dd HH:mm:ss')}" placeholder="yyyy-MM-dd HH:mm:ss"/></div></div>
    <div class="form-group"><label class="col-sm-3 control-label is-required">发放总量：</label><div class="col-sm-8"><input class="form-control" type="number" min="1" name="totalQty" th:value="${template.totalQty!=null?template.totalQty:100}" required/></div></div>
    <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><select class="form-control" name="status"><option value="0" th:selected="${template.status==null or template.status=='0'}">正常</option><option value="1" th:selected="${template.status=='1'}">停用</option></select></div></div>
    <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea class="form-control" name="remark" th:text="${template.remark}"></textarea></div></div>
</form>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">
var prefix = ctx + 'gas/coupon';
var edit = [[${template.templateId != null}]];
function toggleValidity() {
    var days = $('#validType').val() === 'DAYS';
    $('#daysGroup').toggle(days).find('input').prop('disabled', !days);
    $('.fixedGroup').toggle(!days).find('input').prop('disabled', days);
}
$(function() { toggleValidity(); });
function submitHandler() {
    if ($.validate.form()) $.operate.save(prefix + (edit ? '/edit' : '/add'), $('#form-coupon-edit').serialize());
}
</script>
</body></html>
