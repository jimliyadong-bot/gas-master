<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('库存调整')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-adjust" th:object="${pool}">
			<input type="hidden" name="poolId" th:field="*{poolId}">
			<div class="form-group">
				<label class="col-sm-3 control-label">站点/气种：</label>
				<div class="col-sm-8">
					<p class="form-control-static" th:text="*{stationName} + ' ' + *{gasType} + '（可用 ' + *{available} + '）'"></p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">到货批次：</label>
				<div class="col-sm-8">
					<select class="form-control" name="receiptId" id="receiptId" required>
						<option value="">请选择批次（调整必须指定批次）</option>
						<option th:each="r : ${receipts}" th:text="${r.batchNo} + '（剩余 ' + ${r.remain} + '，到货 ' + ${r.receivedAt} + '）'" th:value="${r.receiptId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">调整数量：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="qty" id="qty" step="0.01" required>
					<span class="help-block m-b-none">正数增加、负数减少；负调整不能超过批次剩余量</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">调整原因：</label>
				<div class="col-sm-8">
					<textarea id="reason" name="reason" class="form-control" required></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "gas/inventory";

		function submitHandler() {
			if ($.validate.form()) {
				$.post(prefix + "/adjust", $("#form-adjust").serialize(), function(result) {
					if (result.code === 0) {
						$.modal.msgSuccess("库存调整成功");
						parent.$.table.refresh();
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						$.modal.alertError(result.msg);
					}
				});
			}
		}
	</script>
</body>
</html>
