<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('预警设置')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-alert" th:object="${pool}">
			<input type="hidden" name="poolId" th:field="*{poolId}">
			<div class="form-group">
				<label class="col-sm-3 control-label">站点/气种：</label>
				<div class="col-sm-8">
					<p class="form-control-static" th:text="*{stationName} + ' ' + *{gasType} + '（可用 ' + *{available} + '）'"></p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">余量预警值：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="alertThreshold" id="alertThreshold" th:value="*{alertThreshold}" min="0" step="0.01">
					<span class="help-block m-b-none">可用量 ≤ 预警值时短信提醒采购商；留空表示关闭预警</span>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "gas/inventory";

		function submitHandler() {
			if ($.validate.form()) {
				$.post(prefix + "/alert", $("#form-alert").serialize(), function(result) {
					if (result.code === 0) {
						$.modal.msgSuccess("预警设置已保存");
						parent.$.table.refresh();
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						$.modal.alertError(result.msg);
					}
				});
			}
		}
	</script>
</body>
</html>
