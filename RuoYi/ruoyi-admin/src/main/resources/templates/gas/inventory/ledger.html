<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('库存流水')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="ledger-form">
					<div class="select-list">
						<ul>
							<li>批次号：<input type="text" name="batchNo"></li>
							<li>气种：<select name="gasType" th:with="type=${@dict.getType('gas_type')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select></li>
							<li>类型：<select name="bizType" th:with="bt=${@dict.getType('gas_ledger_type')}">
									<option value="">所有</option>
									<option th:each="dict : ${bt}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select></li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="col-sm-12 select-table table-striped">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var typeDatas = [[${@dict.getType('gas_ledger_type')}]];
		var gasDatas = [[${@dict.getType('gas_type')}]];
		var prefix = ctx + "gas/inventory";

		$(function() {
			var options = {
				url: prefix + "/ledger/list",
				modalName: "库存流水",
				columns: [
				{ field: 'createTime', title: '发生时间' },
				{ field: 'stationName', title: '所属站点' },
				{ field: 'gasType', title: '气种', align: 'center', formatter: function(v) { return $.table.selectDictLabel(gasDatas, v); } },
				{ field: 'bizType', title: '类型', align: 'center', formatter: function(v, row) {
						var cls = { 'IN': 'success', 'CONSUME': 'primary', 'ADJUST': 'danger', 'RESERVE': 'warning', 'RELEASE': 'info' }[v] || 'default';
						return '<span class="label label-' + cls + '">' + $.table.selectDictLabel(typeDatas, v) + '</span>';
					} },
				{ field: 'qty', title: '数量', align: 'right' },
				{ field: 'batchNo', title: '批次号', formatter: function(v) { return v || '-'; } },
				{ field: 'orderId', title: '订单ID', formatter: function(v) { return v && v !== 0 ? v : '-'; } },
				{ field: 'reason', title: '原因', formatter: function(v) { return v || '-'; } },
				{ field: 'operator', title: '操作人' }]
			};
			$.table.init(options);
		});
	</script>
</body>
</html>
