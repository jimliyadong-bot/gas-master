<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('库存台账')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="pool-form">
					<div class="select-list">
						<ul>
							<li>气种：<select name="gasType" th:with="type=${@dict.getType('gas_type')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select></li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-info" onclick="$.modal.open('库存流水', ctx + 'gas/inventory/ledger')"><i class="fa fa-list-alt"></i> 库存流水</a>
			</div>

			<div class="col-sm-12 select-table table-striped">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var adjustFlag = [[${@permission.hasPermi('gas:inventory:adjust')}]];
		var alertFlag = [[${@permission.hasPermi('gas:inventory:alert')}]];
		var gasDatas = [[${@dict.getType('gas_type')}]];
		var prefix = ctx + "gas/inventory";

		$(function() {
			var options = {
				url: prefix + "/pool/list",
				modalName: "库存池",
				columns: [
				{ field: 'stationName', title: '所属站点' },
				{ field: 'buyerName', title: '采购商' },
				{ field: 'gasType', title: '气种', align: 'center', formatter: function(v) { return $.table.selectDictLabel(gasDatas, v); } },
				{ field: 'totalIn', title: '累计入库', align: 'right' },
				{ field: 'adjusted', title: '累计调整', align: 'right' },
				{ field: 'consumed', title: '累计实扣', align: 'right' },
				{ field: 'reserved', title: '当前预占', align: 'right' },
				{ field: 'available', title: '可用量', align: 'right', formatter: function(v) { return '<b>' + v + '</b>'; } },
				{ field: 'alertThreshold', title: '预警值', align: 'right', formatter: function(v, row) {
						if (v == null) { return '<span class="text-muted">未设置</span>'; }
						var cls = row.available <= v ? 'label label-danger' : 'label label-success';
						return '<span class="' + cls + '">' + (row.available <= v ? '低于预警' : '正常') + '</span> ' + v;
					} },
				{
					title: '操作', align: 'center',
					formatter: function(value, row, index) {
						var actions = [];
						actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="showReceipts(' + row.poolId + ')"><i class="fa fa-cubes"></i>批次余量</a> ');
						actions.push('<a class="btn btn-warning btn-xs ' + adjustFlag + '" href="javascript:void(0)" onclick="$.modal.open(\'库存调整\', prefix + \'/adjust/\' + ' + row.poolId + ')"><i class="fa fa-wrench"></i>调整</a> ');
						actions.push('<a class="btn btn-primary btn-xs ' + alertFlag + '" href="javascript:void(0)" onclick="$.modal.open(\'预警设置\', prefix + \'/alert/\' + ' + row.poolId + ')"><i class="fa fa-bell-o"></i>预警</a>');
						return actions.join('');
					}
				}]
			};
			$.table.init(options);
		});

		// 批次余量弹层（该站该气种的到货批次）
		function showReceipts(poolId) {
			$.get(prefix + "/pool/receipts/" + poolId, function(result) {
				if (result.code !== 0) { $.modal.alertError(result.msg); return; }
				var rows = result.data || [];
				var html = '<table class="table table-striped table-bordered" style="margin:10px"><thead><tr>'
					+ '<th>批次号</th><th>入库数量</th><th>累计调整</th><th>已实扣</th><th>剩余量</th><th>到货时间</th></tr></thead><tbody>';
				$.each(rows, function(i, r) {
					html += '<tr><td>' + r.batchNo + '</td><td>' + r.qty + '</td><td>' + r.adjusted + '</td><td>'
						+ r.consumed + '</td><td><b>' + r.remain + '</b></td><td>' + r.receivedAt + '</td></tr>';
				});
				html += '</tbody></table>';
				if (rows.length === 0) { html = '<p class="text-center text-muted" style="margin:15px">暂无到货记录</p>'; }
				top.layer.open({ type: 1, title: '到货批次余量（先进先出）', area: ['680px', '420px'], content: html });
			});
		}
	</script>
</body>
</html>
