<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('新增采购批次')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-batch-add">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">批次号：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="batchNo" id="batchNo" th:value="${nextBatchNo}" maxlength="32" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">所属站点：</label>
				<div class="col-sm-8">
					<select class="form-control" name="stationId" id="stationId" required>
						<option value="">请选择站点</option>
						<option th:each="s : ${stations}" th:text="${s.stationName} + '（' + ${s.stationCode} + '）'" th:value="${s.stationId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">气种：</label>
				<div class="col-sm-8">
					<select class="form-control" name="gasType" id="gasType" required>
						<option value="">请选择气种</option>
						<option th:each="dict : ${@dict.getType('gas_type')}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">采购日期：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="purchaseDate" id="purchaseDate" th:value="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">采购数量：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="qty" id="qty" min="0.01" step="0.01" placeholder="CNG 为 m³，LNG 为 kg" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">采购单价（元）：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="unitPrice" id="unitPrice" min="0.0001" step="0.0001" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">采购金额（元）：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="amount" id="amount" min="0.01" step="0.01" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "gas/purchase/batch";

		// 数量 × 单价 联动计算金额
		$("#qty, #unitPrice").on("input", function() {
			var qty = parseFloat($("#qty").val());
			var price = parseFloat($("#unitPrice").val());
			if (qty > 0 && price > 0) {
				$("#amount").val((qty * price).toFixed(2));
			}
		});

		$("#form-batch-add").validate({
			onkeyup: false,
			rules: {
				batchNo: { remote: { url: prefix + "/checkBatchNoUnique", type: "post", dataType: "json", data: { batchNo: function() { return $.common.trim($("#batchNo").val()); } } } }
			},
			messages: { batchNo: { remote: "批次号已存在" } },
			focusCleanup: true
		});

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/add", $("#form-batch-add").serialize());
			}
		}
	</script>
</body>
</html>
