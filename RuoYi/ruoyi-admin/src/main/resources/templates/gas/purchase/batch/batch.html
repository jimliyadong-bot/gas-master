<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('采购批次')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="batch-form">
					<div class="select-list">
						<ul>
							<li>批次号：<input type="text" name="batchNo"></li>
							<li>站点：<select name="stationId" id="stationId">
									<option value="">所有</option>
									<option th:each="s : ${stations}" th:text="${s.stationName}" th:value="${s.stationId}"></option>
								</select></li>
							<li>气种：<select name="gasType" th:with="type=${@dict.getType('gas_type')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select></li>
							<li>付款状态：<select name="payStatus" th:with="st=${@dict.getType('gas_pay_status')}">
									<option value="">所有</option>
									<option th:each="dict : ${st}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select></li>
							<li>票据状态：<select name="invoiceStatus" th:with="st=${@dict.getType('gas_invoice_status')}">
									<option value="">所有</option>
									<option th:each="dict : ${st}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select></li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="gas:batch:add"><i class="fa fa-plus"></i> 新增</a>
				<a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="gas:batch:export"><i class="fa fa-download"></i> 导出</a>
				<a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="gas:batch:remove"><i class="fa fa-remove"></i> 删除</a>
			</div>

			<div class="col-sm-12 select-table table-striped">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var editFlag = [[${@permission.hasPermi('gas:batch:edit')}]];
		var removeFlag = [[${@permission.hasPermi('gas:batch:remove')}]];
		var invoiceFlag = [[${@permission.hasPermi('gas:batch:invoice')}]];
		var payDatas = [[${@dict.getType('gas_pay_status')}]];
		var invDatas = [[${@dict.getType('gas_invoice_status')}]];
		var gasDatas = [[${@dict.getType('gas_type')}]];
		var prefix = ctx + "gas/purchase/batch";

		$(function() {
			var options = {
				url: prefix + "/list",
				createUrl: prefix + "/add",
				updateUrl: prefix + "/edit/{id}",
				removeUrl: prefix + "/remove",
				exportUrl: prefix + "/export",
				modalName: "采购批次",
				columns: [{
					checkbox: true
				},
				{ field: 'batchNo', title: '批次号' },
				{ field: 'stationName', title: '所属站点' },
				{ field: 'buyerName', title: '采购商' },
				{ field: 'gasType', title: '气种', align: 'center', formatter: function(v) { return $.table.selectDictLabel(gasDatas, v); } },
				{ field: 'purchaseDate', title: '采购日期' },
				{ field: 'qty', title: '采购数量', align: 'right' },
				{ field: 'unitPrice', title: '采购单价', align: 'right' },
				{ field: 'amount', title: '金额', align: 'right' },
				{ field: 'receivedQty', title: '已到货', align: 'right' },
				{ field: 'paidAmount', title: '已付款', align: 'right' },
				{ field: 'payStatus', title: '付款状态', align: 'center', formatter: function(v) { return $.table.selectDictLabel(payDatas, v); } },
				{ field: 'invoiceStatus', title: '票据状态', align: 'center', formatter: function(v) { return $.table.selectDictLabel(invDatas, v); } },
				{
					title: '操作', align: 'center',
					formatter: function(value, row, index) {
						var actions = [];
						actions.push('<a class="btn btn-success btn-xs ' + invoiceFlag + '" href="javascript:void(0)" onclick="$.modal.open(\'维护票据状态\', prefix + \'/invoice/\' + ' + row.batchId + ')"><i class="fa fa-file-text-o"></i>票据</a> ');
						actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.batchId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
						actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.batchId + '\')"><i class="fa fa-remove"></i>删除</a>');
						return actions.join('');
					}
				}]
			};
			$.table.init(options);
		});
	</script>
</body>
</html>
