<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('付款登记')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-payment-add">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">采购批次：</label>
				<div class="col-sm-8">
					<select class="form-control" name="batchId" id="batchId" required>
						<option value="">请选择批次</option>
						<option th:each="b : ${batches}" th:text="${b.batchNo} + '（' + ${b.stationName} + ' 金额' + ${b.amount} + '）'" th:value="${b.batchId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">付款金额（元）：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="amount" id="amount" min="0.01" step="0.01" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">付款日期：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="paidAt" id="paidAt" th:value="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">付款方式：</label>
				<div class="col-sm-8">
					<select class="form-control" name="payMethod" id="payMethod" required>
						<option value="">请选择</option>
						<option th:each="dict : ${@dict.getType('gas_purchase_pay_method')}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">付款凭证（URL）：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="voucherUrl" id="voucherUrl" maxlength="500">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "gas/purchase/payment";

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/add", $("#form-payment-add").serialize());
			}
		}
	</script>
</body>
</html>
