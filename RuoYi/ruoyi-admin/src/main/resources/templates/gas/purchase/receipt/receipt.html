<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('到货入库')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="receipt-form">
					<div class="select-list">
						<ul>
							<li>批次号：<input type="text" name="batchNo"></li>
							<li>气种：<select name="gasType" th:with="type=${@dict.getType('gas_type')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select></li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="gas:receipt:add"><i class="fa fa-plus"></i> 到货登记</a>
				<a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="gas:receipt:export"><i class="fa fa-download"></i> 导出</a>
			</div>

			<div class="col-sm-12 select-table table-striped">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var gasDatas = [[${@dict.getType('gas_type')}]];
		var prefix = ctx + "gas/purchase/receipt";

		$(function() {
			var options = {
				url: prefix + "/list",
				createUrl: prefix + "/add",
				exportUrl: prefix + "/export",
				modalName: "到货入库",
				columns: [{
					checkbox: true
				},
				{ field: 'batchNo', title: '批次号' },
				{ field: 'stationName', title: '所属站点' },
				{ field: 'buyerName', title: '采购商' },
				{ field: 'gasType', title: '气种', align: 'center', formatter: function(v) { return $.table.selectDictLabel(gasDatas, v); } },
				{ field: 'qty', title: '入库数量', align: 'right' },
				{ field: 'consumed', title: '已实扣', align: 'right' },
				{ field: 'adjusted', title: '累计调整', align: 'right' },
				{ field: 'remain', title: '剩余量', align: 'right' },
				{ field: 'receivedAt', title: '到货时间' },
				{ field: 'createBy', title: '登记人' },
				{ field: 'remark', title: '备注' }]
			};
			$.table.init(options);
		});
	</script>
</body>
</html>
