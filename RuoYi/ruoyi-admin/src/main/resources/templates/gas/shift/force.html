<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('强制交班')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-shift-force">
        <input type="hidden" name="shiftId" th:value="${shift.shiftId}" />
        <div class="form-group"><label class="col-sm-3 control-label">站点：</label><div class="col-sm-8"><p class="form-control-static" th:text="${shift.stationName}"></p></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">当班人：</label><div class="col-sm-8"><p class="form-control-static" th:text="${shift.staffName}"></p></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">开始时间：</label><div class="col-sm-8"><p class="form-control-static" th:text="${#dates.format(shift.startedAt, 'yyyy-MM-dd HH:mm:ss')}"></p></div></div>
        <div class="form-group"><label class="col-sm-3 control-label is-required">交班原因：</label><div class="col-sm-8">
            <textarea name="endReason" class="form-control" rows="4" maxlength="255" required placeholder="例如：员工忘记交班，电话确认后由管理员强制交班"></textarea>
        </div></div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + 'gas/shift';
function submitHandler() {
    if ($.validate.form()) {
        $.operate.save(prefix + '/force', $('#form-shift-force').serialize());
    }
}
</script>
</body></html>
