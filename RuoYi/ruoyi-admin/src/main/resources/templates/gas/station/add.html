<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('新增站点')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-station-add">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">站点编码：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="stationCode" id="stationCode" placeholder="如 GX01" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">站点名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="stationName" id="stationName" required>
					<span class="help-block m-b-none">保存后自动在根部门下创建同名部门（用于站点管理员/加气员数据权限）</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">所属采购商：</label>
				<div class="col-sm-8">
					<select class="form-control" name="buyerId" id="buyerId" required>
						<option value="">请选择采购商</option>
						<option th:each="buyer : ${buyers}" th:text="${buyer.buyerName}" th:value="${buyer.buyerId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">地址：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="address" id="address">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:checked="${dict.default}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "gas/station";

		$("#form-station-add").validate({
			onkeyup: false,
			rules: {
				stationCode: {
					remote: {
						url: prefix + "/checkStationCodeUnique",
						type: "post",
						dataType: "json",
						data: {
							"stationCode": function() {
								return $.common.trim($("#stationCode").val());
							}
						}
					}
				}
			},
			messages: {
				"stationCode": { remote: "站点编码已经存在" }
			},
			focusCleanup: true
		});

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/add", $('#form-station-add').serialize());
			}
		}
	</script>
</body>
</html>
