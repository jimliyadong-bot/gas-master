<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('修改站点')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-station-edit" th:object="${station}">
			<input id="stationId" name="stationId" th:field="*{stationId}" type="hidden">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">站点编码：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="stationCode" id="stationCode" th:field="*{stationCode}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">站点名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="stationName" id="stationName" th:field="*{stationName}" required>
					<span class="help-block m-b-none">站点改名将同步更新对应部门名称</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">所属采购商：</label>
				<div class="col-sm-8">
					<select class="form-control" name="buyerId" id="buyerId" required>
						<option value="">请选择采购商</option>
						<option th:each="buyer : ${buyers}" th:text="${buyer.buyerName}" th:value="${buyer.buyerId}"
							th:selected="${buyer.buyerId == station.buyerId}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">地址：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="address" th:field="*{address}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">二维码标识：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" th:value="*{qrToken}" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "gas/station";

		$("#form-station-edit").validate({
			onkeyup: false,
			rules: {
				stationCode: {
					remote: {
						url: prefix + "/checkStationCodeUnique",
						type: "post",
						dataType: "json",
						data: {
							"stationId": function() { return $("#stationId").val(); },
							"stationCode": function() { return $.common.trim($("#stationCode").val()); }
						}
					}
				}
			},
			messages: {
				"stationCode": { remote: "站点编码已经存在" }
			},
			focusCleanup: true
		});

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/edit", $('#form-station-edit').serialize());
			}
		}
	</script>
</body>
</html>
